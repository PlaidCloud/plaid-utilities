[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "plaidcloud-utilities"
authors = [
    {name = "Michael Rea", email = "mike@plaidcloud.com"},
    {name = "Paul Morel", email = "paul@plaidcloud.com"},
]
maintainers = [
    {name = "Pat Buxton", email = "pat@plaidcloud.com"},
    {name = "Charlie Laymon", email = "charlie@plaidcloud.com"},
    {name = "Simon Moscrop", email = "simon@plaidcloud.com"},
]
description = "PlaidCloud Common Utilities for PlaidLink, PlaidXL and Custom Transforms"
requires-python = ">=3.10"
keywords = ["plaidcloud", "utilities"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version", "readme", "dependencies"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
"plaidcloud.utilities" = ["test_fixtures/*.json"]

[tool.setuptools_scm]

[project.optional-dependencies]
test = [
    "pytest",
    "mock",
    "minimock",
    "pyarrow",
    "pytest-cov",
    "pytest-runner",
    "sqlalchemy-greenplum",
    "starrocks",
    "databend_sqlalchemy",
    "databricks-sqlalchemy",
    "databricks-sql-connector",
    "snowflake-sqlalchemy",
]
full = [
    "plaidcloud-rpc[full]>=1.11.0",
    "fastavro",
]
xray = [
    "yxdb>=1.0.0",
]
jupyter = [
    "ipython",
]

[project.urls]
Homepage = "https://plaidcloud.com"
Documentation = "https://docs.plaidcloud.com"
Repository = "https://github.com/PlaidCloud/plaid-utilities.git"
Issues = "https://github.com/PlaidCloud/plaid-utilities/issues"

[tool.black]
line-length = 125
target-version = ['py312']
skip-string-normalization = true

[tool.ruff]
line-length = 125
target-version = "py312"
extend-exclude = ["plaidcloud/utilities/test_fixtures"]

[tool.ruff.lint]
# Start conservative -- mirrors the kinds of issues pylint was catching.
# Expand the `select` list to ramp up strictness (e.g. add "B", "UP", "PL").
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, unused imports, etc.)
    "W",   # pycodestyle warnings
    "I",   # isort
]
ignore = [
    "E501",  # line-too-long -- handled by black at 125 chars
    "E731",  # lambda assignments
]

[tool.ruff.lint.per-file-ignores]
"plaidcloud/utilities/tests/*" = ["F401", "F811"]  # tolerate unused imports / redefinitions in tests
"**/__init__.py" = ["F401"]                        # re-exports

[tool.pytest.ini_options]
# addopts = "-v --maxfail=25 -p no:warnings -p no:logging --doctest-modules"
addopts = "--tb=native -v -r sfxX --maxfail=25 -p no:warnings -p no:logging --doctest-modules --cov=. --cov-report=xml --junitxml=pytestresult.xml"

[tool.coverage.run]
omit = ["plaidcloud/utilities/tests/*"]

[tool.coverage.report]
include = ["./plaidcloud/*"]
